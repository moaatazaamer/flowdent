server:
  port: 8081

spring:
  application:
    name: backend-service
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        connection:
          characterEncoding: utf8mb4
          useUnicode: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  # Override with the JWT_SECRET environment variable (min 32 characters).
  secret: ${JWT_SECRET:change-me-flowdent-dev-placeholder-secret-key-0123456789}
  expiration: ${JWT_EXPIRATION:86400000}

stripe:
  # Use Stripe TEST keys via environment variables. Placeholders keep the app bootable.
  secret-key: ${STRIPE_SECRET_KEY:sk_test_placeholder}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_placeholder}
  currency: ${STRIPE_CURRENCY:egp}

app:
  upload-dir: ${UPLOAD_DIR:uploads}
